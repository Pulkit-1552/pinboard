name: ci_cd

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: pinboard-frontend
            context: frontend
          - image: pinboard-backend
            context: backend
          - image: pinboard-nginx
            context: nginx
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          platforms: linux/amd64
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:latest

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: latest
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          envs: DOCKERHUB_USERNAME,IMAGE_TAG
          command_timeout: 20m
          script: |
            if [ ! -d "$HOME/pinboard/.git" ]; then
              git clone https://github.com/Pulkit-1552/pinboard.git "$HOME/pinboard"
            fi
            cd "$HOME/pinboard"
            git pull
            sudo docker compose pull
            sudo docker compose up -d
