
name: pinboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pinboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pinboard}
      POSTGRES_DB: ${POSTGRES_DB:-pinboard}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pinboard} -d ${POSTGRES_DB:-pinboard}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-pinboard}/pinboard-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-pinboard}:${POSTGRES_PASSWORD:-pinboard}@db:5432/${POSTGRES_DB:-pinboard}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USERNAME:-pinboard}/pinboard-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped
    expose:
      - "80"

  nginx:
    build: ./nginx
    image: ${DOCKERHUB_USERNAME:-pinboard}/pinboard-nginx:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
