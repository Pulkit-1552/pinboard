name: pinboard

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: pinboard
      POSTGRES_PASSWORD: pinboard
      POSTGRES_DB: pinboard
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pinboard -d pinboard"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    image: ${DOCKERHUB_USERNAME:-pinboard}/pinboard-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: postgres://pinboard:pinboard@db:5432/pinboard
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    image: ${DOCKERHUB_USERNAME:-pinboard}/pinboard-frontend:${IMAGE_TAG:-local}
    restart: unless-stopped

  nginx:
    build: ./nginx
    image: ${DOCKERHUB_USERNAME:-pinboard}/pinboard-nginx:${IMAGE_TAG:-local}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
